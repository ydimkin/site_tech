services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432" # Changed from 5432 to 5433 to avoid conflict with your running postgres instance
    volumes:
      - ./db_data:/var/lib/postgresql/data
    restart: always

  backend:
    build: 
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSLMODE=disable
      - APP_PORT=${APP_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=http://localhost,http://localhost:5173
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
